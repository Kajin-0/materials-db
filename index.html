<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>MaterialsDB | Engineering Materials Reference</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="style.css" />
  <link rel="icon" href="data:;base64,iVBORw0KGgo=">
</head>
<body class="homepage">
  <header id="index-header" role="banner">
    <h1 onclick="window.location.href='index.html'" title="Go to MaterialsDB Home" style="cursor:pointer;">MaterialsDB</h1>
    <p class="header-subtitle">Technical reference index for engineering materials selection and analysis.</p>
  </header>

  <main id="index-main" aria-label="Material lookup workspace">
    <section id="search-panel" aria-labelledby="search-panel-title">
      <h2 id="search-panel-title">Material Lookup</h2>
      <p class="search-panel-description">Search by chemical formula, material name, processing class, or application tags. Filter results by industry domain, category, and taxonomy tag.</p>

      <div id="search-container">
        <label class="visually-hidden" for="searchInput">Search materials</label>
        <input id="searchInput" type="text" placeholder="e.g., SiC, UHMWPE, thermal barrier coating, industry:aerospace" autocomplete="off" />
        <ul id="suggestions" role="listbox" aria-label="Search suggestions"></ul>
      </div>
    </section>

    <section class="toolbar" id="toolbar" aria-label="Result filters">
      <div class="filter-group">
        <label for="industryFilter">Industry Domain</label>
        <select id="industryFilter" disabled>
          <option value="">Loading...</option>
        </select>
      </div>
      <div class="filter-group">
        <label for="categoryFilter">Material Category</label>
        <select id="categoryFilter" disabled>
          <option value="">Loading...</option>
        </select>
      </div>
      <div class="filter-group">
        <label for="propertyFilter">Tag</label>
        <select id="propertyFilter" disabled>
          <option value="">Loading...</option>
        </select>
      </div>
    </section>

    <section id="results-region" aria-live="polite" aria-atomic="false">
      <div id="results-meta" class="results-meta" hidden></div>
      <div id="results"></div>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/fuse.js@6.6.2"></script>
  <script src="app.js"></script>
</body>
</html>
